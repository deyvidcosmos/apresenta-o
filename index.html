<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Linguagens Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #91a7bd, #4ca1af);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        p {
            color: #555;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            display: block;
            background-color: #2c3e50;
            color: rgb(238, 238, 238);
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            transition: background-color 0.3s ease;
        }

        .links a:hover {
            background-color: #4b769e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Seja bem-vindo ao meu Site</h1>
        <p>Clique no link a seguir</p>

        <div class="links">
            <a href="oquefazemos.html">Nossa história</a>
            <a href="programas.html">Nossos programas</a>
        </div>
    </div>

</body>
</html>
